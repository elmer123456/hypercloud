envVarGroups:
  - name: drime-multi-vault-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
services:
  - type: keyvalue
    name: drime-multi-vault-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
  - type: web
    name: drime-multi-vault-api
    runtime: node
    plan: free
    buildCommand: bash bootstrap.sh && npm ci --include=dev && npm run prisma:generate -w backend && npm run build -w backend
    startCommand: bash -c "npm run prisma:deploy -w backend && (npm run worker:start -w backend &) && (while true; do sleep 21600; npm run schedule -w backend; done &) && npm start -w backend"
    healthCheckPath: /health
    envVars:
      - fromGroup: drime-multi-vault-secrets
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: drime-multi-vault-redis
          property: connectionString
      - key: DRIME_API_BASE_URL
        value: https://app.drime.cloud/api/v1
      - key: FRONTEND_URL
        value: https://drime-multi-vault-web.onrender.com
  - type: web
    name: drime-multi-vault-web
    runtime: static
    buildCommand: bash bootstrap.sh && npm ci --include=dev && npm run build -w frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: https://drime-multi-vault-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: drime-multi-vault-db
    plan: free
    databaseName: drime_vault
    user: drime_vault
