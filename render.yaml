envVarGroups:
  - name: drime-multi-vault-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
services:
  - type: keyvalue
    name: drime-multi-vault-redis
    plan: starter
    ipAllowList: []
  - type: web
    name: drime-multi-vault-api
    runtime: node
    plan: starter
    buildCommand: bash bootstrap.sh && npm ci && npm run prisma:generate -w backend && npm run build -w backend
    preDeployCommand: npm run prisma:deploy -w backend
    startCommand: npm start -w backend
    healthCheckPath: /health
    envVars:
      - fromGroup: drime-multi-vault-secrets
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: drime-multi-vault-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: drime-multi-vault-redis
          property: connectionString
      - key: DRIME_API_BASE_URL
        value: https://app.drime.cloud/api/v1
      - key: FRONTEND_URL
        value: https://drime-multi-vault-web.onrender.com
  - type: worker
    name: drime-multi-vault-worker
    runtime: node
    plan: starter
    buildCommand: bash bootstrap.sh && npm ci && npm run prisma:generate -w backend && npm run build -w backend
    startCommand: npm run worker:start -w backend
    envVars:
      - fromGroup: drime-multi-vault-secrets
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: drime-multi-vault-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: drime-multi-vault-redis
          property: connectionString
      - key: DRIME_API_BASE_URL
        value: https://app.drime.cloud/api/v1
      - key: FRONTEND_URL
        value: https://drime-multi-vault-web.onrender.com
  - type: cron
    name: drime-multi-vault-scheduler
    runtime: node
    plan: starter
    schedule: "0 */6 * * *"
    buildCommand: bash bootstrap.sh && npm ci && npm run build -w backend
    startCommand: npm run schedule -w backend
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: drime-multi-vault-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: drime-multi-vault-redis
          property: connectionString
      - key: JWT_SECRET
        value: cron-not-used-but-config-required-123456
      - key: TOKEN_ENCRYPTION_KEY
        value: cron-not-used-but-config-required-123456
  - type: web
    name: drime-multi-vault-web
    runtime: static
    buildCommand: bash bootstrap.sh && npm ci && npm run build -w frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: https://drime-multi-vault-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: drime-multi-vault-db
    plan: basic-256mb
    databaseName: drime_vault
    user: drime_vault
