name: Hyper Cloud Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - hypercloud-release-20261020.b64

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout app bundle
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Decode project source
        run: bash bootstrap.sh

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build bundled app assets
        run: npm run build -w frontend
        env:
          VITE_API_URL: https://drime-multi-vault-api.onrender.com/api

      - name: Package local web assets into Android app
        working-directory: frontend
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hyper-Cloud-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
# APK assets are bundled locally via Capacitor.x
