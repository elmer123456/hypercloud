name: Build Hyper Cloud Android APK


on:
  workflow_dispatch:
  push:
    paths:
      - 'hypercloud-release-20261021.b64'
      - 'hypercloud-release-20261031.b64'
      - 'hypercloud-release-20261104.b64'
      - 'hypercloud-hotfix-20261104-r2.patch'
      - 'hypercloud-release-20261026-mfa-share.b64'
      - 'bootstrap.sh'
      - '.github/workflows/build-android.yml'


permissions:
  contents: read


jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project bundle
        uses: actions/checkout@v4


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'


      - name: Reconstruct the app source
        run: bash bootstrap.sh


      - name: Install dependencies
        run: npm ci --include=dev


      - name: Build bundled app assets
        run: npm run build -w frontend
        env:
          VITE_API_URL: https://drime-multi-vault-api.onrender.com/api


      - name: Generate native Android project
        working-directory: frontend
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android-manifest.mjs


      - name: Install Hyper Cloud launcher icons
        working-directory: frontend
        run: |
          set -euo pipefail
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            source_dir="android-icons/mipmap-${density}"
            target_dir="android/app/src/main/res/mipmap-${density}"
            test -s "${source_dir}/ic_launcher.png"
            mkdir -p "${target_dir}"
            cp -f "${source_dir}"/ic_launcher*.png "${target_dir}/"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cat > android/app/src/main/res/values/hypercloud_icon_background.xml <<'XML'
          <resources>
            <color name="hypercloud_icon_background">#000000</color>
          </resources>
          XML
          for icon in ic_launcher ic_launcher_round; do
            cat > "android/app/src/main/res/mipmap-anydpi-v26/${icon}.xml" <<XML
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/hypercloud_icon_background" />
            <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          done
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(file, 'utf8');
          const appTag = xml.match(/<application\b[^>]*>/);
          if (!appTag) throw new Error('Android manifest has no application tag');
          let updated = appTag[0];
          if (!/\bandroid:icon=/.test(updated)) updated = updated.replace('<application', '<application android:icon="@mipmap/ic_launcher"');
          if (!/\bandroid:roundIcon=/.test(updated)) updated = updated.replace('<application', '<application android:roundIcon="@mipmap/ic_launcher_round"');
          xml = xml.replace(appTag[0], updated);
          fs.writeFileSync(file, xml);
          NODE


      - name: Configure persistent release signing and version
        working-directory: frontend/android
        env:
          HYPERCLOUD_ANDROID_SIGNING_BUNDLE: ${{ secrets.HYPERCLOUD_ANDROID_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$HYPERCLOUD_ANDROID_SIGNING_BUNDLE"
          node <<'NODE'
          const fs = require('node:fs');
          const bundle = JSON.parse(process.env.HYPERCLOUD_ANDROID_SIGNING_BUNDLE);
          const keyStorePath = `${process.env.RUNNER_TEMP}/hypercloud-release.jks`;
          fs.writeFileSync(keyStorePath, Buffer.from(bundle.keystoreBase64, 'base64'), { mode: 0o600 });
          const envLines = [
            `HYPERCLOUD_KEYSTORE_PATH=${keyStorePath}`,
            `HYPERCLOUD_STORE_PASSWORD=${bundle.storePassword}`,
            `HYPERCLOUD_KEY_ALIAS=${bundle.keyAlias}`,
            `HYPERCLOUD_KEY_PASSWORD=${bundle.keyPassword}`,
          ];
          fs.appendFileSync(process.env.GITHUB_ENV, `${envLines.join('\n')}\n`);
          const gradleFile = 'app/build.gradle';
          let gradle = fs.readFileSync(gradleFile, 'utf8');
          if (!/android\s*\{/.test(gradle)) throw new Error('Generated Android Gradle file is missing the android block');
          const signingBlock = `android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("HYPERCLOUD_KEYSTORE_PATH"))
                      storePassword System.getenv("HYPERCLOUD_STORE_PASSWORD")
                      keyAlias System.getenv("HYPERCLOUD_KEY_ALIAS")
                      keyPassword System.getenv("HYPERCLOUD_KEY_PASSWORD")
                  }
              }
          `;
          gradle = gradle.replace(/android\s*\{\s*/, signingBlock);
          if (!/versionCode\s+\d+/.test(gradle)) throw new Error('Generated Android Gradle file has no versionCode');
          if (!/versionName\s+"[^"]+"/.test(gradle)) throw new Error('Generated Android Gradle file has no versionName');
          const runNumber = Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isSafeInteger(runNumber) || runNumber < 1) throw new Error('Invalid GitHub Actions run number');
          gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${1000 + runNumber}`);
          gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "1.0.${runNumber}"`);
          const releaseBlock = /(buildTypes\s*\{\s*release\s*\{)/;
          if (!releaseBlock.test(gradle)) throw new Error('Generated Android Gradle file has no release build type');
          gradle = gradle.replace(releaseBlock, '$1\n            signingConfig signingConfigs.release');
          fs.writeFileSync(gradleFile, gradle);
          NODE


      - name: Build installable APK
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease


      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hyper-Cloud-Android-APK
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
