name: Hypercloud database backup to MEGA

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hypercloud-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify MEGA credentials and available quota
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MEGA_EMAIL:-}" ] || [ -z "${MEGA_PASSWORD:-}" ]; then
            echo '::error::GitHub secrets MEGA_EMAIL and MEGA_PASSWORD are required.'
            exit 1
          fi
          npm install --prefix /tmp/hypercloud-mega --no-audit --no-fund --no-save megajs@1.3.10
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          const require = createRequire('/tmp/hypercloud-mega/package.json');
          const { Storage } = require('megajs');
          const email = process.env.MEGA_EMAIL;
          const password = process.env.MEGA_PASSWORD;
          let storage;
          const redact = (message) => String(message || 'unknown error')
            .replaceAll(email, '[MEGA_EMAIL]')
            .replaceAll(password, '[MEGA_PASSWORD]');
          try {
            storage = await new Storage({
              email,
              password,
              keepalive: false,
              autoload: true,
              userAgent: 'HypercloudBackup/1.0',
            }).ready;
            const account = await storage.getAccountInfo();
            const total = Number(account.spaceTotal || 0);
            const used = Number(account.spaceUsed || 0);
            const summary = {
              status: 'ok',
              megaTotalBytes: total,
              megaUsedBytes: used,
              megaFreeBytes: Math.max(0, total - used),
            };
            console.log(JSON.stringify(summary));
            if (process.env.GITHUB_STEP_SUMMARY) {
              const mib = (n) => (n / 1024 / 1024).toFixed(1);
              await import('node:fs').then(({ appendFileSync }) => appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                `## MEGA preflight: OK\n\n- Total: ${mib(total)} MiB\n- Used: ${mib(used)} MiB\n- Free: ${mib(Math.max(0, total - used))} MiB\n`,
              ));
            }
          } catch (error) {
            console.error(`MEGA preflight failed: ${redact(error?.message || error)}`);
            process.exitCode = 1;
          } finally {
            try { await storage?.close(); } catch {}
          }
          NODE

      - name: Create and test a PostgreSQL backup
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo '::error::GitHub secret RENDER_DATABASE_URL is not configured.'
            exit 1
          fi
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          name="hypercloud-db-${stamp}.dump"
          echo "DUMP_NAME=$name" >> "$GITHUB_ENV"
          echo "DUMP_FILE=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
          docker run --rm --user 0 \
            --env DATABASE_URL \
            --env DUMP_NAME="$name" \
            --volume "$RUNNER_TEMP:/backup" \
            postgres:18-alpine \
            sh -euc 'pg_dump --dbname="$DATABASE_URL" --format=custom --compress=9 --no-owner --no-privileges --no-tablespaces --file="/backup/$DUMP_NAME"; pg_restore --list "/backup/$DUMP_NAME" >/dev/null'
          docker run --rm --user 0 \
            --env DUMP_NAME="$name" \
            --volume "$RUNNER_TEMP:/backup" \
            postgres:18-alpine \
            sh -euc '
              mkdir -p /tmp/pgdata
              chown postgres:postgres /tmp/pgdata
              su postgres -s /bin/sh -c "initdb -D /tmp/pgdata --auth=trust"
              su postgres -s /bin/sh -c "pg_ctl -D /tmp/pgdata -o \"-h 127.0.0.1 -p 55432\" -w start"
              trap "su postgres -s /bin/sh -c \"pg_ctl -D /tmp/pgdata -m fast -w stop\"" EXIT
              createdb -h 127.0.0.1 -p 55432 -U postgres restore_check
              pg_restore --exit-on-error --no-owner --no-privileges --no-tablespaces -h 127.0.0.1 -p 55432 -U postgres -d restore_check "/backup/$DUMP_NAME"
              count="$(psql -h 127.0.0.1 -p 55432 -U postgres -d restore_check -Atc "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname NOT IN ('\''pg_catalog'\'', '\''information_schema'\'')")"
              test "$count" -gt 0
            '
          echo 'Backup archive created and restored successfully in a temporary database.'

      - name: Upload, verify, and rotate MEGA backups
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          MEGA_FOLDER: Hypercloud-Backups
          DUMP_FILE: ${{ env.DUMP_FILE }}
        run: |
          set -euo pipefail
          if [ -z "${MEGA_EMAIL:-}" ] || [ -z "${MEGA_PASSWORD:-}" ]; then
            echo '::error::GitHub secrets MEGA_EMAIL and MEGA_PASSWORD are required.'
            exit 1
          fi
          cp .github/workflows/backup-mega.mjs /tmp/hypercloud-mega/backup-mega.mjs
          cd /tmp/hypercloud-mega
          node backup-mega.mjs

      - name: Report failure
        if: failure()
        run: |
          echo 'Backup failed. No new copy is confirmed; inspect this workflow run and restore the latest verified MEGA backup if needed.' >> "$GITHUB_STEP_SUMMARY"name: Hypercloud database backup to MEGA

